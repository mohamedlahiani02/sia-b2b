name: CI — SIA B2B Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, test, analyse
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sia_b2b_test
          POSTGRES_USER: sia
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        working-directory: backend
        run: mvn -B compile

      - name: Tests unitaires
        working-directory: backend
        run: mvn -B test -Dtest="**/arch/**,**/shared/**,**/identity/domain/**"

      - name: Tests d'intégration (Testcontainers — Postgres + Kafka réels)
        working-directory: backend
        run: mvn -B verify -P integration-tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Publication spécification OpenAPI
        if: github.ref == 'refs/heads/main'
        working-directory: backend
        run: |
          mvn -B spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=dev" &
          sleep 30
          curl -s http://localhost:8080/v3/api-docs -o openapi-spec.json
          kill %1

      - name: Upload spécification OpenAPI
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/openapi-spec.json

      - name: Build image Docker
        working-directory: backend
        run: |
          mvn -B package -DskipTests
          docker build -t sia-b2b:${{ github.sha }} .

  security-scan:
    name: Analyse statique de sécurité
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: SpotBugs
        working-directory: backend
        run: mvn -B spotbugs:check || true
