<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SIA B2B — Panier</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/mockData.js?v=3"></script>
<script type="text/babel" src="components/Icon.jsx"></script>
<script type="text/babel" src="components/Chrome.jsx"></script>
<script type="text/babel" src="components/Product.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function seedDemoCart() {
  if (Cart.get().length === 0) {
    const samples = window.SIA_DATA.PRODUCTS.filter(p => p.status.key === 'ok' || p.status.key === 'low').slice(0, 4);
    samples.forEach((p, i) => Cart.add(p, i === 0 ? 2 : 1));
  }
}

function App() {
  const { items, count, total } = useCart();
  useEffect(() => { seedDemoCart(); }, []);

  const remise = total * 0.15;
  const totalHT = total;
  const totalTVA = (total - remise) * 0.19;
  const totalTTC = total - remise + totalTVA;

  return (
    <>
      <AppHeader cartCount={count} />
      <SessionTimer />
      <VehicleBar />

      <div className="page page-tight">
        <div className="breadcrumb">
          <a href="Home.html">Accueil</a>
          <Icon name="chevronRight" size={12} />
          <span>Mon panier</span>
        </div>
        <div className="page-header">
          <div>
            <h1 className="page-title">Mon panier</h1>
            <div className="page-sub">{count} article{count > 1 ? 's' : ''} · Prix remisés appliqués</div>
          </div>
          <a href="Search.html" className="btn btn-ghost"><Icon name="plus" size={14} /> Ajouter un article</a>
        </div>

        {items.length === 0 ? (
          <div className="card" style={{ padding: 64, textAlign: 'center' }}>
            <div style={{ width: 64, height: 64, borderRadius: 16, background: 'var(--surface-2)', display: 'inline-grid', placeItems: 'center', color: 'var(--ink-3)' }}><Icon name="cart" size={24} /></div>
            <div style={{ fontSize: 18, fontWeight: 700, marginTop: 16 }}>Votre panier est vide</div>
            <div className="muted" style={{ marginTop: 4 }}>Parcourez le catalogue pour commencer votre commande.</div>
            <a href="Search.html" className="btn btn-primary" style={{ marginTop: 20 }}>Commencer une recherche</a>
          </div>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 380px', gap: 24 }}>
            <div className="card" style={{ overflow: 'hidden' }}>
              <table className="tbl">
                <thead>
                  <tr>
                    <th style={{ width: 72 }}></th>
                    <th>Article</th>
                    <th>Prix unitaire</th>
                    <th>Quantité</th>
                    <th>Sous-total</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  {items.map(item => {
                    const product = window.SIA_DATA.PRODUCTS.find(p => p.id === item.id) || { family: 'Moteur' };
                    return (
                      <tr key={item.id}>
                        <td><ProductImage product={product} size={56} /></td>
                        <td>
                          <div style={{ fontWeight: 700, fontSize: 13 }}>{item.supplier}</div>
                          <div className="mono" style={{ fontSize: 12, color: 'var(--ink-2)', marginTop: 2 }}>{item.ref}</div>
                          <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 4, textTransform: 'uppercase' }}>{item.name}</div>
                        </td>
                        <td>
                          <div className="mono tnum" style={{ fontWeight: 600, fontSize: 14 }}>{item.price.toFixed(3)} <span style={{ fontSize: 10, color: 'var(--ink-3)' }}>DT</span></div>
                          {item.discount > 0 && <div style={{ fontSize: 11, textDecoration: 'line-through', color: 'var(--ink-4)', marginTop: 2 }}>{item.priceBase.toFixed(3)} DT</div>}
                        </td>
                        <td>
                          <QtyStepper value={item.qty} onChange={(q) => Cart.setQty(item.id, q)} />
                        </td>
                        <td>
                          <div className="mono tnum" style={{ fontWeight: 700, fontSize: 15, letterSpacing: '-0.01em' }}>{(item.price * item.qty).toFixed(3)} <span style={{ fontSize: 10, color: 'var(--ink-3)' }}>DT</span></div>
                        </td>
                        <td>
                          <button onClick={() => Cart.remove(item.id)} className="icon-btn" style={{ width: 32, height: 32, color: 'var(--ink-4)' }}>
                            <Icon name="trash" size={14} />
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div>
              <div className="card" style={{ padding: 20, position: 'sticky', top: 160 }}>
                <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: '-0.01em', marginBottom: 16 }}>Récapitulatif</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10, fontSize: 13 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: 'var(--ink-3)' }}>Sous-total HT</span>
                    <span className="mono tnum">{totalHT.toFixed(3)} DT</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', color: 'var(--sia-red)' }}>
                    <span>Remise partenaire (15 %)</span>
                    <span className="mono tnum">−{remise.toFixed(3)} DT</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: 'var(--ink-3)' }}>TVA (19 %)</span>
                    <span className="mono tnum">{totalTVA.toFixed(3)} DT</span>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <span style={{ color: 'var(--ink-3)' }}>Livraison</span>
                    <span style={{ color: 'oklch(0.45 0.12 155)', fontWeight: 600 }}>Gratuite</span>
                  </div>
                </div>
                <div style={{ borderTop: '1px solid var(--border)', marginTop: 14, paddingTop: 14, display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <span style={{ fontWeight: 700 }}>Total TTC</span>
                  <span className="mono tnum" style={{ fontSize: 22, fontWeight: 700, letterSpacing: '-0.02em' }}>{totalTTC.toFixed(3)} <span style={{ fontSize: 11, color: 'var(--ink-3)' }}>DT</span></span>
                </div>

                <div style={{ marginTop: 16 }}>
                  <label className="label">Code promo</label>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <input className="input" placeholder="Entrer le code" />
                    <button className="btn btn-ghost">Appliquer</button>
                  </div>
                </div>

                <a href="Checkout.html" className="btn btn-primary btn-lg" style={{ width: '100%', justifyContent: 'center', marginTop: 18 }}>
                  Valider ma commande <Icon name="arrowRight" size={14} />
                </a>
                <div style={{ marginTop: 14, fontSize: 11, color: 'var(--ink-3)', display: 'flex', alignItems: 'center', gap: 6, justifyContent: 'center' }}>
                  <Icon name="lock" size={12} /> Paiement sécurisé · Facturation après expédition
                </div>
              </div>

              <div style={{ marginTop: 14, padding: 14, background: 'var(--sia-red-soft)', border: '1px solid var(--sia-red-border)', borderRadius: 10, fontSize: 12 }}>
                <div style={{ fontWeight: 600, color: 'oklch(0.40 0.18 25)', marginBottom: 4 }}>💡 Rappel partenaire</div>
                <div style={{ color: 'var(--ink-2)' }}>Votre remise de 15 % est appliquée automatiquement. Pour les commandes &gt; 1 500 DT, un commercial vous contacte sous 2 h.</div>
              </div>
            </div>
          </div>
        )}
      </div>

      <AppFooter />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
