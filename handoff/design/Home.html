  { name: 'TRW',         bg: '#E3000F', fg: '#fff',    style: 'bold' },
  { name: 'SACHS',       bg: '#1A1A1A', fg: '#fff',    style: 'bold' },
  { name: 'MAHLE',       bg: '#005CA9', fg: '#fff',    style: 'bold' },

function SupplierLogo({ item }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      height: 68, width: 140, flexShrink: 0,
      background: item.bg,
      border: item.border ? `2px solid ${item.border}` : '1px solid transparent',
      borderRadius: 10,
      cursor: 'pointer',
      transition: 'transform 0.18s, box-shadow 0.18s',
      boxShadow: '0 1px 4px rgba(0,0,0,0.08)',
    }}
    onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = '0 6px 18px rgba(0,0,0,0.18)'; }}
    onMouseLeave={e => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = '0 1px 4px rgba(0,0,0,0.08)'; }}
    >
      <span style={{
        fontFamily: 'var(--font-sans)',
        fontWeight: 900,
        fontSize: 15,
        letterSpacing: '0.04em',
        color: item.fg,
        fontStyle: item.style === 'italic' ? 'italic' : 'normal',
        userSelect: 'none',
      }}>{item.name}</span>
    </div>
  );
}

function CarBrandLogo({ item }) {
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 6,
      height: 80, width: 120, flexShrink: 0,
      background: 'var(--surface)',
      border: '1px solid var(--border)',
      borderRadius: 10,
      cursor: 'pointer',
      transition: 'transform 0.18s, border-color 0.18s, box-shadow 0.18s',
    }}
    onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.borderColor = item.color; e.currentTarget.style.boxShadow = `0 6px 18px ${item.color}30`; }}
    onMouseLeave={e => { e.currentTarget.style.transform = ''; e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.boxShadow = ''; }}
    >
      <div style={{ fontSize: 20, lineHeight: 1, color: item.color, userSelect: 'none' }}>{item.symbol}</div>
      <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 800, fontSize: 10, letterSpacing: '0.08em', color: 'var(--ink-2)', textTransform: 'uppercase', userSelect: 'none' }}>{item.name}</div>
    </div>
  );
}

function Marquee({ children, speed = 38, reverse = false }) {
  return (
    <div style={{ overflow: 'hidden', position: 'relative' }}>
      <div style={{
        display: 'flex', gap: 12,
        width: 'max-content',
        animation: `marquee${reverse ? 'Rev' : ''} ${speed}s linear infinite`,
      }}>
        {children}{children}
      </div>
      <style>{`
        @keyframes marquee    { from { transform: translateX(0) } to { transform: translateX(-50%) } }
        @keyframes marqueeRev { from { transform: translateX(-50%) } to { transform: translateX(0) } }
      `}</style>
    </div>
  );
}

function StatCard({ icon, label, value, sub, accent }) {
  return (
    <div className="card" style={{ padding: 18, display: 'flex', alignItems: 'flex-start', gap: 14 }}>
      <div style={{ width: 40, height: 40, borderRadius: 10, background: accent ? 'var(--sia-red-soft)' : 'var(--surface-2)', display: 'grid', placeItems: 'center', color: accent ? 'var(--sia-red)' : 'var(--ink-2)', flexShrink: 0 }}>
        <Icon name={icon} size={18} />
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 11, color: 'var(--ink-3)', fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase' }}>{label}</div>
        <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: '-0.02em', marginTop: 2 }}>{value}</div>
        {sub && <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 2 }}>{sub}</div>}
      </div>
    </div>
  );
}

const TWEAKS = /*EDITMODE-BEGIN*/{
  "accentColor": "#C8102E",
  "density": "spacious",
  "heroStyle": "gradient"
}/*EDITMODE-END*/;

function TweaksPanel({ visible, tweaks, onChange }) {
  if (!visible) return null;
  return (
    <div style={{ position: 'fixed', bottom: 20, right: 20, width: 280, background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 12, boxShadow: '0 10px 40px rgba(0,0,0,0.15)', zIndex: 9999, overflow: 'hidden' }}>
      <div style={{ padding: '12px 16px', background: 'var(--ink)', color: 'white', fontWeight: 700, fontSize: 13, display: 'flex', alignItems: 'center', gap: 8 }}>
        <Icon name="settings" size={14} /> Tweaks
      </div>
      <div style={{ padding: 16, display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--ink-3)', marginBottom: 6 }}>Couleur d'accent</div>
          <div style={{ display: 'flex', gap: 6 }}>
            {[['#C8102E', 'Rouge SIA'], ['#0B5FFF', 'Bleu'], ['#0E7C4A', 'Vert'], ['#1A1A1A', 'Noir']].map(([c, n]) => (
              <button key={c} title={n} onClick={() => onChange({ accentColor: c })} style={{ width: 32, height: 32, borderRadius: 8, background: c, border: tweaks.accentColor === c ? '2px solid var(--ink)' : '2px solid var(--border)', cursor: 'pointer' }} />
            ))}
          </div>
        </div>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--ink-3)', marginBottom: 6 }}>Hero</div>
          <div style={{ display: 'flex', gap: 6 }}>
            {['dark', 'light', 'gradient'].map(s => (
              <button key={s} onClick={() => onChange({ heroStyle: s })} className="btn btn-sm" style={{ flex: 1, background: tweaks.heroStyle === s ? 'var(--ink)' : 'transparent', color: tweaks.heroStyle === s ? 'white' : 'var(--ink-2)', border: '1px solid var(--border)', textTransform: 'capitalize' }}>{s}</button>
            ))}
          </div>
        </div>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--ink-3)', marginBottom: 6 }}>Densité</div>
          <div style={{ display: 'flex', gap: 6 }}>
            {['compact', 'comfortable', 'spacious'].map(d => (
              <button key={d} onClick={() => onChange({ density: d })} className="btn btn-sm" style={{ flex: 1, background: tweaks.density === d ? 'var(--ink)' : 'transparent', color: tweaks.density === d ? 'white' : 'var(--ink-2)', border: '1px solid var(--border)', textTransform: 'capitalize' }}>{d}</button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tweaks, setTweaks] = useState(TWEAKS);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  useEffect(() => {
    document.documentElement.style.setProperty('--sia-red', tweaks.accentColor);
  }, [tweaks.accentColor]);

  const update = (patch) => {
    const next = { ...tweaks, ...patch };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };

  return <><AppInner /><TweaksPanel visible={tweaksVisible} tweaks={tweaks} onChange={update} /></>;
}

      {/* Quick categories */}

          {[
            { label: 'Huile moteur', icon: 'layers', count: '842 réf.' },

}

</script>
